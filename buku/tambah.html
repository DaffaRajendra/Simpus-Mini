<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Tambah Buku</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="navbar navbar-expand-lg navbar-dark" style="background-color:#1d5b8a;">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="../index.html">SIMPUS-Mini</a>
            <button class="navbar-toggler" type="button" id="nav-toggle-btn" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href=" list.html">List Buku</a></li>
                    <li class="nav-item"><a class="nav-link active" href="tambah.html">Tambah Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="../anggota/list.html">List Anggota</a></li>
                    <li class="nav-item"><a class="nav-link" href="../anggota/tambah.html">Tambah Anggota</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <form id="form-tambah" novalidate>
            <div class="mb-3">
                <label for="judul" class="form-label fw-semibold">Judul</label>
                <input type="text" class="form-control" id="judul" name="judul" required>
            </div>
            <div class="mb-3">
                <label for="pengarang" class="form-label fw-semibold">Pengarang</label>
                <input type="text" class="form-control" id="pengarang" name="pengarang" required>
            </div>
            <div class="mb-3">
                <label for="tahun" class="form-label fw-semibold">Tahun Terbit</label>
                <input type="number" class="form-control" id="tahun" name="tahun" min="1900" max="2026" required>
            </div>
            <div class="mb-3">
                <label for="isbn" class="form-label fw-semibold">ISBN</label>
                <input type="text" class="form-control" id="isbn" name="isbn" required>
            </div>
            <div class="mb-3">
                <label for="stok" class="form-label fw-semibold">Stok</label>
                <input type="number" class="form-control" id="stok" name="stok" required>
            </div>
            <div class="mb-3">
                <label for="kategori" class="form-label fw-semibold">Kategori</label>
                <select id="kategori" name="kategori" class="form-select">
                    <option value="fiksi">Fiksi</option>
                    <option value="non-fiksi">Non-Fiksi</option>
                    <option value="referensi">Referensi</option>
                </select>
            </div>
            <div class="mb-3">
                <button type="submit" class="btn" style="background-color:#1d5b8a; color:#fff;">Simpan</button>
                <!-- <button type="submit" class="btn btn-primary">Simpan</button> -->
            </div>  
        </form>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 6</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>
</body>
</html>
