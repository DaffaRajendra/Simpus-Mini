<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | List Buku</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="navbar navbar-expand-lg navbar-dark" style="background-color:#1d5b8a;">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="index.html">SIMPUS-Mini</a>
            <button class="navbar-toggler" type="button" id="nav-toggle-btn" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link active" href="list.html">List Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="tambah.html">Tambah Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="../anggota/list.html">List Anggota</a></li>
                    <li class="nav-item"><a class="nav-link" href="../anggota/tambah.html">Tambah Anggota</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section>
            <h2>Daftar Buku</h2>
            <div class="search-box">
                <label for="search-input">Cari Judul Buku</label>
                <input type="text" id="search-input" placeholder="Ketik judul buku...">
            </div>
            <div id="loading-indicator" class="text-muted my-3" style="display:none;">
                <span class="spinner-border spinner-border-sm me-2"></span>Memuat data...
            </div>
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                <thead style="background-color:#1d5b8a;">
                    <tr class="text-white">
                        <th>Judul</th>
                        <th>Pengarang</th>
                        <th>Stok</th>
                        <th>Tahun</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Baris diisi dinamis oleh assets/js/buku.js via fetch('../data/buku.json') -->
                </tbody>
            </table>
            </div>
        </section>    
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 6</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/buku.js"></script>
</body>
